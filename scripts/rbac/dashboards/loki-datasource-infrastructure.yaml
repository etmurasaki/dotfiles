apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: loki-datasource-infrastructure
  namespace: openshift-logging
spec:
  config:
    display:
      name: "Loki Datasource (Infrastructure Logs)"
    default: false
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            # URL structure for LokiStack with openshift-logging tenancy:
            # https://{gateway-svc}.{ns}.svc:8080/api/logs/v1/{tenant}
            # Perses will append /loki/api/v1/... for queries
            url: https://logging-loki-gateway-http.openshift-logging.svc.cluster.local:8080/api/logs/v1/infrastructure
            headers:
              X-Scope-OrgID: infrastructure
            # IMPORTANT: Must reference secret for TLS config
            secret: loki-datasource-infrastructure-secret
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
