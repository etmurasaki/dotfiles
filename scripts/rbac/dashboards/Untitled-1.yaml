apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: tempo-datasource
  namespace: chainsaw-multitenancy
spec:
  config:
    display:
      name: "Tempo Datasource"
    default: true
    plugin:
      kind: "TempoDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://tempo-simplest-gateway-chainsaw-multitenancy.apps.emurasak-422.qe.devcluster.openshift.com




apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: loki-datasource
  namespace: observ-test
spec:
  config:
    display:
      name: "Loki Datasource"
    default: true
    plugin:
      kind: "LokiDatasource"
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://logging-loki-gateway-http.openshift-logging.svc.cluster.local
